name: Build Quest APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup build environment
        uses: ./.github/actions/setup

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare universal APK
        run: |
          mkdir -p dist
          find app/build/outputs/apk -type f -name '*.apk' -print
          universal="$(find app/build/outputs/apk -type f -name '*.apk' ! -name '*arm64-v8a*' ! -name '*armeabi-v7a*' | head -n 1)"
          if [ -z "$universal" ]; then
            echo "Universal APK not found" >&2
            exit 1
          fi
          cp "$universal" dist/Quest-test.apk
          sha256sum dist/Quest-test.apk > dist/SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Quest-test-apk
          path: dist/*
          if-no-files-found: error

      - name: Publish test APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete quest-test --yes --cleanup-tag 2>/dev/null || true
          git tag -f quest-test "${GITHUB_SHA}"
          git push --force origin refs/tags/quest-test
          gh release create quest-test dist/Quest-test.apk dist/SHA256SUMS.txt \
            --title "Quest test APK" \
            --notes "Development test build from commit ${GITHUB_SHA}. Debug-signed; for testing only." \
            --prerelease
